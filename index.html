<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<meta name="description" content="Tempo: an AI planning assistant that turns what you say into a realistic, time-blocked day.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237C3AED'/%3E%3Crect x='10' y='10' width='12' height='12' rx='2.5' fill='white' transform='rotate(45 16 16)'/%3E%3C/svg%3E">

</head>
<body>
<title>Tempo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Tempo design system. Layout: one centered column of bordered white cards, bottom tabs on phones, left rail on wide screens.
   Identity is purple; task icons keep their own semantic colours. Every colour is a token, redefined for dark mode. */
:root {
  --bg: #FAFAFA; --card: #FFFFFF; --surface: #F4F4F5; --fg: #171717; --fg-2: #404040; --muted: #737373;
  --line: #ECECEE; --line-2: #DEDEE2;
  --accent: #7C3AED; --accent-deep: #6D28D9; --accent-fg: #FFFFFF; --accent-soft: #EDE9FE; --accent-softer: #F5F3FF; --accent-text: #6D28D9;
  --good: #15803D; --good-soft: #DCFCE7; --warn: #B45309; --warn-soft: #FEF3C7; --bad: #B91C1C; --bad-soft: #FEE2E2;
  --shadow: 0 1px 2px rgba(23, 23, 23, .04); --shadow-pop: 0 14px 44px rgba(23, 23, 23, .16);
  --r-card: 20px; --r-tile: 16px; --r-ctl: 12px;
  --font-display: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  /* semantic task colours (tile background, icon) */
  --t-math: #DBEAFE; --t-math-fg: #2563EB;
  --t-science: #DCFCE7; --t-science-fg: #16A34A;
  --t-chemistry: #CCFBF1; --t-chemistry-fg: #0D9488;
  --t-business: #D1FAE5; --t-business-fg: #059669;
  --t-reading: #E0F2FE; --t-reading-fg: #0284C7;
  --t-writing: #E0E7FF; --t-writing-fg: #4F46E5;
  --t-coding: #FEF9C3; --t-coding-fg: #A16207;
  --t-admin: #FCE7F3; --t-admin-fg: #DB2777;
  --t-work: #E2E8F0; --t-work-fg: #475569;
  --t-break: #FFEDD5; --t-break-fg: #EA580C;
  --t-meal: #FEF3C7; --t-meal-fg: #D97706;
  --t-exercise: #ECFCCB; --t-exercise-fg: #65A30D;
  --t-family: #FFE4E6; --t-family-fg: #E11D48;
  --t-free: #EDE9FE; --t-free-fg: #7C3AED;
  --t-other: #F4F4F5; --t-other-fg: #71717A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090B; --card: #18181B; --surface: #27272A; --fg: #FAFAFA; --fg-2: #D4D4D8; --muted: #A1A1AA;
    --line: #27272A; --line-2: #3F3F46;
    --accent: #8B5CF6; --accent-deep: #7C3AED; --accent-fg: #FFFFFF; --accent-soft: #2E2356; --accent-softer: #1D1833; --accent-text: #A78BFA;
    --good: #4ADE80; --good-soft: #12301D; --warn: #FBBF24; --warn-soft: #3A2A0C; --bad: #F87171; --bad-soft: #3B1515;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-pop: 0 14px 44px rgba(0, 0, 0, .65);
    --t-math: #1E2A4A; --t-math-fg: #7AA2FF; --t-science: #12301D; --t-science-fg: #4ADE80; --t-chemistry: #0F2E2B; --t-chemistry-fg: #2DD4BF;
    --t-business: #0E2E22; --t-business-fg: #34D399; --t-reading: #0F2A3B; --t-reading-fg: #38BDF8; --t-writing: #22244D; --t-writing-fg: #A5B4FC;
    --t-coding: #332B0A; --t-coding-fg: #FACC15; --t-admin: #3D1429; --t-admin-fg: #F472B6; --t-work: #262B33; --t-work-fg: #A8B3C4;
    --t-break: #3A1F0C; --t-break-fg: #FB923C; --t-meal: #37280A; --t-meal-fg: #FBBF24; --t-exercise: #223009; --t-exercise-fg: #A3E635;
    --t-family: #3F1320; --t-family-fg: #FB7185; --t-free: #2E2356; --t-free-fg: #A78BFA; --t-other: #27272A; --t-other-fg: #A1A1AA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090B; --card: #18181B; --surface: #27272A; --fg: #FAFAFA; --fg-2: #D4D4D8; --muted: #A1A1AA;
  --line: #27272A; --line-2: #3F3F46;
  --accent: #8B5CF6; --accent-deep: #7C3AED; --accent-fg: #FFFFFF; --accent-soft: #2E2356; --accent-softer: #1D1833; --accent-text: #A78BFA;
  --good: #4ADE80; --good-soft: #12301D; --warn: #FBBF24; --warn-soft: #3A2A0C; --bad: #F87171; --bad-soft: #3B1515;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-pop: 0 14px 44px rgba(0, 0, 0, .65);
  --t-math: #1E2A4A; --t-math-fg: #7AA2FF; --t-science: #12301D; --t-science-fg: #4ADE80; --t-chemistry: #0F2E2B; --t-chemistry-fg: #2DD4BF;
  --t-business: #0E2E22; --t-business-fg: #34D399; --t-reading: #0F2A3B; --t-reading-fg: #38BDF8; --t-writing: #22244D; --t-writing-fg: #A5B4FC;
  --t-coding: #332B0A; --t-coding-fg: #FACC15; --t-admin: #3D1429; --t-admin-fg: #F472B6; --t-work: #262B33; --t-work-fg: #A8B3C4;
  --t-break: #3A1F0C; --t-break-fg: #FB923C; --t-meal: #37280A; --t-meal-fg: #FBBF24; --t-exercise: #223009; --t-exercise-fg: #A3E635;
  --t-family: #3F1320; --t-family-fg: #FB7185; --t-free: #2E2356; --t-free-fg: #A78BFA; --t-other: #27272A; --t-other-fg: #A1A1AA;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; } ul { margin: 0; padding: 0; list-style: none; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
#app { min-height: 100%; }
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
.main { width: 100%; max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(104px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--card) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-inner { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px 9px; color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600; letter-spacing: .01em; transition: color .15s, background .15s, transform .15s; }
.nav a svg { width: 22px; height: 22px; }
.nav a.on { color: var(--accent-text); }
.nav a:active { transform: scale(.94); }
.nav .brand { display: none; padding: 6px 12px 18px; }
.nav .brand .b1 { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.nav .brand .b1 i { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); display: inline-block; transform: rotate(45deg); }
.nav .brand .b2 { font-size: 11px; font-weight: 700; color: var(--accent-text); text-transform: uppercase; letter-spacing: .14em; margin-top: 2px; }
@media (min-width: 980px) {
  .shell { grid-template-columns: 220px minmax(0, 1fr); }
  .nav { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px)); border-top: 0; border-right: 1px solid var(--line); background: var(--card); backdrop-filter: none; -webkit-backdrop-filter: none; padding: 24px 14px; }
  .nav-inner { display: flex; flex-direction: column; gap: 4px; }
  .nav a { flex-direction: row; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; }
  .nav a.on { background: var(--accent-soft); }
  .nav a:hover:not(.on) { background: var(--surface); color: var(--fg); }
  .nav .brand { display: block; }
  .main { padding-block: 28px 64px; max-width: 760px; }
}

/* ---------- cards & pills ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 18px; }
@media (min-width: 560px) { .card { padding: 22px 24px; } }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.card-head h2 { font-size: 19px; font-weight: 700; }
.head-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: var(--surface); color: var(--fg-2); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent-text); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill svg { width: 13px; height: 13px; }
.sec-lbl { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; display: flex; align-items: center; gap: 8px; margin: 10px 0 2px; }
.sec-lbl::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sec-lbl.prot-lbl { color: var(--accent-text); margin-top: 18px; }

/* ---------- header ---------- */
.hero { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 4px 4px 0; flex-wrap: wrap; }
.hero h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.02em; }
.hero .sub { color: var(--muted); font-weight: 500; margin-top: 2px; }
.clock { text-align: right; }
.clock .time { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; white-space: nowrap; }
.clock .date { color: var(--muted); font-size: 13px; font-weight: 500; }
.hero-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
@media (max-width: 560px) { .hero-side { flex-direction: row; align-items: center; justify-content: space-between; width: 100%; } .hero-side .clock { text-align: left; display: flex; align-items: baseline; gap: 8px; } .hero-side .clock .time { font-size: 19px; } .seg .tx { display: none; } .seg button { padding: 7px 10px; } .sched-head { flex-wrap: nowrap; } .sched-head h2 { min-width: 0; } .sched-head .head-tools { flex-wrap: nowrap; flex-shrink: 0; } .sched-head .pill.good { display: none; } .finish-row { display: block !important; margin: -2px 0 8px; } }
.finish-row { display: none; }
.daynav { display: inline-flex; align-items: center; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.daynav .lbl { font-weight: 700; font-size: 13.5px; padding: 0 10px; min-width: 96px; text-align: center; }
.daynav .ibtn { border-radius: 999px; }

/* ---------- quick add & banners ---------- */
.quick { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.quick .in { border-radius: 14px; padding-left: 40px; }
.quick .wrap { position: relative; }
.quick .wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--accent-text); pointer-events: none; }
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--accent-softer); border: 1px solid var(--accent-soft); color: var(--fg); border-radius: 16px; padding: 12px 14px; }
.banner .t { font-weight: 600; }
.banner .s { color: var(--muted); font-size: 13px; }
.banner .acts2 { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- progress ---------- */
.progress { display: grid; grid-template-columns: 92px 1fr; gap: 18px; align-items: center; }
.ring { width: 92px; height: 92px; position: relative; }
.ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.ring .track { stroke: var(--surface); }
.ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); animation: ringIn 1.1s cubic-bezier(.2,.8,.2,1) backwards; }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 21px; }
.stats { display: grid; grid-template-columns: repeat(3, auto); gap: 6px 20px; justify-content: start; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.stat .k { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.next { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.next .lbl { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.next .t { font-weight: 600; }
.next .when { color: var(--muted); }
@media (max-width: 460px) { .progress { grid-template-columns: 76px 1fr; gap: 14px; } .ring, .ring svg { width: 76px; height: 76px; } .ring .lbl { font-size: 17px; } .stats { gap: 4px 14px; } .stat .v { font-size: 17px; } }
.now-box { margin-top: 14px; border-radius: 16px; background: var(--accent-softer); border: 1px solid var(--accent-soft); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.now-box .who { font-weight: 600; }
.now-box .lbl { font-size: 11px; font-weight: 700; color: var(--accent-text); text-transform: uppercase; letter-spacing: .1em; }
.now-box .big { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.01em; }
.now-box .big.over { color: var(--bad); }
.now-box .ctl { display: flex; gap: 6px; flex-wrap: wrap; }
.late-row { margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }

/* ---------- intelligence ---------- */
.intel { background: linear-gradient(180deg, var(--accent-softer), var(--card) 70%); border-color: var(--accent-soft); }
.intel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.intel-head .orb { width: 34px; height: 34px; border-radius: 11px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; flex-shrink: 0; }
.intel-head .orb svg { width: 18px; height: 18px; }
.intel-head h2 { font-size: 17px; font-weight: 700; }
.intel-head .st { margin-left: auto; }
.intel-line { font-weight: 600; margin-bottom: 12px; }
.intel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mini { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.mini .v { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.mini .k { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.sprintbar { height: 8px; border-radius: 99px; background: var(--surface); overflow: hidden; margin: 12px 0 4px; }
.sprintbar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.sprintcap { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
.sug { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.sug:first-of-type { margin-top: 10px; }
.sug .t { display: flex; gap: 8px; align-items: flex-start; color: var(--fg-2); min-width: 0; flex: 1 1 220px; }
.sug .t svg { width: 17px; height: 17px; color: var(--accent-text); flex-shrink: 0; margin-top: 2px; }
.sug.alert .t svg { color: var(--warn); }
.learn { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); font-size: 13.5px; display: flex; flex-direction: column; gap: 6px; }
.learn div { display: flex; gap: 8px; } .learn svg { width: 15px; height: 15px; color: var(--accent-text); flex-shrink: 0; margin-top: 2px; }

/* ---------- task rows ---------- */
.rows { display: flex; flex-direction: column; }
.row { position: relative; border-bottom: 1px solid var(--line); animation: rise .35s cubic-bezier(.2,.8,.2,1) backwards; }
.row:last-child { border-bottom: 0; }
.row.menu-open { z-index: 30; }
.row.swiping { overflow: hidden; overflow: clip; }
.row.dragging { z-index: 40; }
.row.dragging .row-inner { box-shadow: var(--shadow-pop); border-radius: 16px; transform: scale(1.02); }
.row.shift { transition: transform .18s ease; }
.row-inner { display: grid; grid-template-columns: 60px 1fr auto; gap: 14px; align-items: start; padding: 16px 0; background: var(--card); position: relative; touch-action: pan-y; }
.row.dragging .row-inner, .row.swiping .row-inner { padding-left: 8px; padding-right: 8px; margin: 0 -8px; }
.swipe-bg { position: absolute; inset: 0; display: none; align-items: center; gap: 8px; padding: 0 18px; font-weight: 700; color: #fff; }
.row.swiping .swipe-bg { display: flex; }
.swipe-bg.del { background: #DC2626; justify-content: flex-end; }
.swipe-bg.ok { background: #16A34A; justify-content: flex-start; }
.swipe-bg svg { width: 20px; height: 20px; }
.tile { width: 60px; height: 60px; border-radius: var(--r-tile); display: grid; place-items: center; background: var(--t-other); color: var(--t-other-fg); flex-shrink: 0; transition: transform .2s; }
.tile svg { width: 25px; height: 25px; }
.tile.grab { cursor: grab; touch-action: none; }
.tile.grab:active { cursor: grabbing; }
.row:hover .tile { transform: translateY(-1px); }
.row .body { min-width: 0; }
.row .title { font-family: var(--font-display); font-weight: 700; font-size: 16.5px; line-height: 1.3; overflow-wrap: anywhere; }
.row .title .range { white-space: nowrap; }
.row .dur { color: var(--muted); font-size: 13px; font-weight: 500; margin-top: 2px; }
.checks { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.ck { display: flex; gap: 9px; align-items: flex-start; text-align: left; color: var(--fg-2); padding: 2px 0; }
.ck .box { width: 17px; height: 17px; border-radius: 6px; border: 1.5px solid var(--line-2); flex-shrink: 0; margin-top: 2px; display: grid; place-items: center; color: transparent; transition: all .15s; }
.ck .box svg { width: 11px; height: 11px; }
.ck:hover .box { border-color: var(--accent); }
.ck.on .box { background: var(--accent); border-color: var(--accent); color: #fff; }
.ck.on .tx { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-2); }
.row .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.timer { margin-top: 10px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--accent-text); font-weight: 600; }
.timer .barw { flex: 1; height: 6px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; max-width: 220px; }
.timer .barw i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 1s linear; }
.timer.over { color: var(--bad); } .timer.over .barw i { background: var(--bad); }
.row.done .title, .row.done .ck .tx { color: var(--muted); }
.row.done .title { text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: var(--line-2); }
.row.done .tile { opacity: .55; animation: tileBump .5s cubic-bezier(.2,1.4,.4,1); }
.row.live .tile { animation: livePulse 2.4s ease-in-out infinite; }

})();

  }

  /* ---------- Focus mode: one task, a big timer, its steps and your notes ---------- */
  function FocusMode({ task, next, prefs, onStatus, onToggleBullet, onNotes, onExtend, onClose }) {
    const running = task.status === "in_progress" && !!task.startedAt; const tick = useTick(running); const tm = timerOf(task, tick);
    const [notes, setNotes] = useState(task.notes || ""); const [full, setFull] = useState(false); const saveT = useRef(null); const wrap = useRef(null);
    useEffect(() => { setNotes(task.notes || ""); }, [task.id]);

    const close = useCallback(() => { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); onClose(); }, [onClose]);
    useEscape(close);
    const toggleFull = () => { const el = wrap.current; if (!el) return; if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); setFull(false); } else if (el.requestFullscreen) el.requestFullscreen().then(() => setFull(true)).catch(() => setFull(false)); };
    const C = 2 * Math.PI * 120; const frac = Math.max(0, Math.min(1, tm.left / tm.total)); const over = tm.left < 0; const look = iconLook(task);
    const bullets = task.bullets || []; const doneB = task.doneBullets || []; const done = task.status === "completed";

        <div class="fb-tools">${document.documentElement.requestFullscreen ? html`<button class="btn sm ghost" onClick=${toggleFull}>${full ? "Exit full screen" : "Full screen"}</button>` : null}<button class="btn sm ghost" onClick=${close}><${Icon} name="x" />Close</button></div>
      </div>
      <div class="focus-main">
        <div class="focus-timer">
          <div class=${"fring" + (over ? " over" : "") + (running ? " run" : "")}>
            <svg viewBox="0 0 260 260"><circle class="tr" cx="130" cy="130" r="120" fill="none" stroke-width="10" /><circle class="ar" cx="130" cy="130" r="120" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray=${C} stroke-dashoffset=${C * (1 - frac)} transform="rotate(-90 130 130)" /></svg>
            <div class="fc"><div class="ft num">${over ? "+" + T.fmtClock(-tm.left / 1000) : T.fmtClock(tm.left / 1000)}</div><div class="fs">${done ? "completed" : over ? "over the estimate" : running ? "remaining" : tm.elapsed > 0 ? "paused" : "ready"}</div></div>
          </div>
          <div class="focus-task"><div class="tile" style=${look.style}><${Glyph} markup=${look.markup} /></div><div style=${{ minWidth: 0 }}><h2>${task.title}</h2><p>${task.start != null ? T.fmtRange(task.start, task.end, prefs.timeFormat) + " · " : ""}${T.fmtDur(task.estimatedMinutes)} planned</p></div></div>
          <div class="focus-ctl">
            ${done ? null : running ? html`<button class="btn ghost" onClick=${() => onStatus(task.id, "upcoming")}><${Icon} name="pause" />Pause</button>` : html`<button class="btn primary" onClick=${() => onStatus(task.id, "in_progress")}><${Icon} name="play" />${tm.elapsed > 0 ? "Resume" : "Start"}</button>`}
            ${done ? null : html`<button class="btn ghost" onClick=${() => onExtend(task.id, 5)}>+5 min</button>`}
            ${done ? html`<button class="btn primary" onClick=${close}>Close</button>` : html`<button class=${"btn " + (running ? "primary" : "soft")} onClick=${() => onStatus(task.id, "completed")}><${Icon} name="check" />Done</button>`}
          </div>
          ${next ? html`<p class="focus-next">Next: <b>${next.title}</b>${next.start != null ? " at " + T.fmtTime(next.start, prefs.timeFormat) : ""}</p>` : null}
        </div>
        <div class="focus-side">
          ${bullets.length ? html`<div class="focus-card"><div class="section-lbl">Steps</div><div class="checks">${bullets.map((b, i) => { const on = doneB.includes(b); return html`<div class=${"ck " + (on ? "on" : "")} key=${i}><button class="box" role="checkbox" aria-checked=${on} aria-label=${b} onClick=${() => onToggleBullet(task.id, b)}><${Icon} name="check" /></button><span class="tx">${b}</span></div>`; })}</div></div>` : null}
          <div class="focus-card grow"><label class="section-lbl" for="focus-notes">Notes for this task</label><textarea id="focus-notes" class="in" value=${notes} onInput=${(e) => type(e.target.value)} placeholder="Links, numbers, things to remember while you work. Saved with the task."></textarea></div>
        </div>
      </div>
    </div>`;
  }

  Object.assign(UI, { Celebration, FocusMode, fx: { taskScene, dayScene } });
})();
</script>
<script>

  const hrs = (m) => (m >= 60 ? (Math.round((m / 60) * 10) / 10) + "h" : Math.round(m) + "m");
  const col = (x, y, w, h, r) => { r = Math.min(r, h, w / 2); return `M${x} ${y + h}V${y + r}Q${x} ${y} ${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h}Z`; };

  /* ---------- weekly chart: planned vs completed minutes per day ----------
     Emphasis form: the completed series in the accent, the planned series in a quiet grey.
     Thin columns, hairline grid, legend, hover and keyboard tooltip, and a table view. */
  function WeekChart({ days, sel, onSel, single }) {
    const ref = useRef(null); const w = useWidth(ref); const [hover, setHover] = useState(-1);
    const H = 190, L = 34, R = 6, Tp = 10, B = 26; const iw = Math.max(10, w - L - R), ih = H - Tp - B;
    const val = (d) => (single ? [d.delay] : [d.planned, d.doneMin]); const peak = Math.max(60, ...days.flatMap(val));
    const step = peak <= 120 ? 30 : peak <= 300 ? 60 : peak <= 600 ? 120 : 180; const top = Math.ceil(peak / step) * step; const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);
    const band = iw / days.length; const cw = Math.max(4, Math.min(24, band * (single ? 0.42 : 0.26))); const y = (v) => Tp + ih - (v / top) * ih;
    const hd = hover >= 0 ? days[hover] : null; const tipX = hover >= 0 ? Math.max(84, Math.min(w - 84, L + band * hover + band / 2)) : 0;

      ${w ? html`<svg width=${w} height=${H} role="img" aria-label=${single ? "Minutes late per day" : "Planned and completed minutes per day"}>

        ${days.map((d, i) => { const cx = L + band * i + band / 2; const vs = val(d);
          return html`<g key=${d.key} class=${"band" + (sel === d.key ? " sel" : "") + (hover === i ? " hov" : "")} tabindex="0" role="button" aria-label=${d.label + " " + d.num + ": " + (single ? d.delay + " minutes late" : hrs(d.planned) + " planned, " + hrs(d.doneMin) + " completed")}
            onPointerEnter=${() => setHover(i)} onPointerLeave=${() => setHover(-1)} onFocus=${() => setHover(i)} onBlur=${() => setHover(-1)} onClick=${() => onSel && onSel(d.key)} onKeyDown=${(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onSel && onSel(d.key); } }}>
            <rect class="hit" x=${L + band * i} y=${Tp - 4} width=${band} height=${ih + B + 2} rx="8" />
            ${single ? (vs[0] > 0 ? html`<path class="s-late" d=${col(cx - cw / 2, y(vs[0]), cw, y(0) - y(vs[0]), 4)} />` : null)
              : html`<g>${vs[0] > 0 ? html`<path class="s-plan" d=${col(cx - cw - 1, y(vs[0]), cw, y(0) - y(vs[0]), 4)} />` : null}${vs[1] > 0 ? html`<path class="s-done" d=${col(cx + 1, y(vs[1]), cw, y(0) - y(vs[1]), 4)} />` : null}</g>`}
            <text class=${"xl" + (d.isToday ? " today" : "")} x=${cx} y=${H - 8} text-anchor="middle">${d.label}</text>

        <line class="axis" x1=${L} x2=${w - R} y1=${y(0)} y2=${y(0)} />

      ${hd ? html`<div class="tip" style=${{ left: tipX + "px" }} role="status">

      </div>` : null}

  }

  /* Estimate vs actual for one day: two thin bars per task. */
  function DayCompare({ tasks }) {
    const rows = tasks.filter((t) => t.status === "completed" && isWork(t) && t.actualMinutes > 0).slice(0, 8);
    if (!rows.length) return html`<p class="quiet">No timed tasks on this day yet. Complete a task with the focus timer running and its real duration shows up here.</p>`;
    const top = Math.max(...rows.flatMap((t) => [t.estimatedMinutes, t.actualMinutes]));
    return html`<div class="cmp">${rows.map((t) => html`<div class="cmp-row" key=${t.id} title=${`${t.title}: planned ${t.estimatedMinutes} min, took ${t.actualMinutes} min`}>
      <div class="cmp-name">${t.title}</div>
      <div class="cmp-bars">
        <div class="cmp-bar"><i class="b-plan" style=${{ width: (t.estimatedMinutes / top) * 100 + "%" }}></i><span class="num">${t.estimatedMinutes}m</span></div>
        <div class="cmp-bar"><i class="b-done" style=${{ width: (t.actualMinutes / top) * 100 + "%" }}></i><span class="num">${t.actualMinutes}m</span></div>
      </div>
    </div>`)}</div>`;
  }

  /* Capacity meter: planned hours against free hours. The track is a lighter step of the fill. */
  function Capacity({ d, compact }) {
    const pct = Math.min(100, Math.round(d.load * 100)); const tone = d.over ? "bad" : d.load > 0.85 ? "warn" : "ok";
    return html`<div class=${"cap cap-" + tone} title=${`${T.fmtShortDur(d.planned)} planned, ${T.fmtShortDur(d.capacity)} free`}>
      <div class="cap-track" role="img" aria-label=${`${T.fmtShortDur(d.planned)} planned of ${T.fmtShortDur(d.capacity)} free${d.over ? ", overloaded" : ""}`}><i style=${{ width: pct + "%" }}></i></div>
      ${compact ? null : html`<div class="cap-txt"><span class="num">${T.fmtShortDur(d.planned)} of ${T.fmtShortDur(d.capacity)}</span>${d.over ? html`<span class="over"><${Icon} name="alert" size=${12} />Overloaded</span>` : null}</div>`}
    </div>`;
  }

  function WeeklyView({ state, today, h, setViewDate }) {
    const ws = state.prefs.weekStart ?? 1; const [anchor, setAnchor] = useState(() => T.weekStart(today, ws)); const [sel, setSel] = useState(today); const [table, setTable] = useState(false);
    const [drag, setDrag] = useState(null); const dragRef = useRef(null); const [picked, setPicked] = useState(null); const lanesRef = useRef(null);
    const stats = useMemo(() => T.weekStats(Object.values(state.tasks), anchor, { prefs: state.prefs, events: state.events, today }), [state.tasks, state.events, state.prefs, anchor, today]);
    const days = stats.days; const selDay = days.find((d) => d.key === sel) || days.find((d) => d.isToday) || days[0]; const fmt = state.prefs.timeFormat;
    const range = T.parseDay(anchor).toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " – " + T.parseDay(T.addDays(anchor, 6)).toLocaleDateString(undefined, { month: "short", day: "numeric" });
    const acc = stats.accuracy == null ? null : Math.round(stats.accuracy * 100); const onTime = stats.tot.timed ? Math.round((stats.tot.onTime / stats.tot.timed) * 100) : null;
    const chips = (d) => d.tasks.filter((t) => t.status !== "protected" && t.category !== "break").sort((a, b) => (a.start ?? 1e9) - (b.start ?? 1e9));
    // drag a chip onto another day's lane
    const laneAt = (x, y) => { const root = lanesRef.current; if (!root) return null; for (const el of root.querySelectorAll("[data-day]")) { const r = el.getBoundingClientRect(); if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return el.getAttribute("data-day"); } return null; };
    const chipDown = (e, t) => { if (e.button != null && e.button !== 0) return; dragRef.current = { id: t.id, from: t.date, x: e.clientX, y: e.clientY, moved: false }; try { e.currentTarget.setPointerCapture(e.pointerId); } catch {} };
    const chipMove = (e) => { const d = dragRef.current; if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y; if (!d.moved && Math.hypot(dx, dy) < 6) return; d.moved = true; setDrag({ id: d.id, dx, dy, over: laneAt(e.clientX, e.clientY) }); };
    const chipUp = (e, t) => { const d = dragRef.current; dragRef.current = null; const over = d && d.moved ? laneAt(e.clientX, e.clientY) : null; setDrag(null); if (!d) return; if (!d.moved) { setPicked(picked === t.id ? null : t.id); return; } if (over && over !== d.from) h.onMoveTask(d.id, over); };
    const Chip = (t) => { const look = iconLook(t); const dg = drag && drag.id === t.id; return html`<button key=${t.id} class=${"wchip" + (t.status === "completed" ? " done" : "") + (dg ? " drag" : "") + (picked === t.id ? " picked" : "")} style=${{ ...(dg ? { transform: `translate(${drag.dx}px, ${drag.dy}px)` } : {}), "--c": `var(--t-${T.tintFor(t)}-fg)`, "--b": `var(--t-${T.tintFor(t)})` }} title=${t.title + " · " + T.fmtShortDur(t.estimatedMinutes) + ". Drag to another day."}
      onPointerDown=${(e) => chipDown(e, t)} onPointerMove=${chipMove} onPointerUp=${(e) => chipUp(e, t)} onPointerCancel=${() => { dragRef.current = null; setDrag(null); }}>
      <span class="wg"><${Glyph} markup=${look.markup} size=${14} /></span><span class="wt">${t.title}</span><span class="wm num">${t.start != null ? T.fmtTime(t.start, fmt) : T.fmtShortDur(t.estimatedMinutes)}</span></button>`; };
    const pickedTask = picked ? state.tasks[picked] : null;
    return html`<${React.Fragment}>
      <header class="hero"><div><h1>Weekly overview</h1><p class="sub">How the week is loaded, how it went, and what Tempo did for you.</p></div>
        <div class="daynav" role="group" aria-label="Week"><button class="ibtn" aria-label="Previous week" onClick=${() => setAnchor(T.addDays(anchor, -7))}><${Icon} name="left" /></button><button class="lbl" onClick=${() => { setAnchor(T.weekStart(today, ws)); setSel(today); }} title="Back to this week">${range}</button><button class="ibtn" aria-label="Next week" onClick=${() => setAnchor(T.addDays(anchor, 7))}><${Icon} name="right" /></button></div>
      </header>

      <section class="card insights" aria-label="Weekly insights">
        <div class="ins-main">
          <div class="ins-lbl">You saved with Tempo</div>
          <div class="ins-hero">${stats.saved ? "about " + T.fmtShortDur(stats.saved) : "0m"}</div>
          <p class="ins-cap">${stats.actions ? `An estimate: Tempo handled ${stats.actions} planning step${stats.actions > 1 ? "s" : ""} for you this week (plans, re-plans, auto-placed tasks), each worth roughly 1 to 5 minutes of doing it by hand.` : "This counts every plan, re-plan and auto-placed task Tempo does for you. Use the assistant, quick add or a suggestion and it starts adding up."}</p>
        </div>

          <div class="tile-s"><div class="k">Finished on time</div><div class="v">${onTime == null ? "–" : onTime + "%"}</div><div class="s">${stats.tot.timed ? `${stats.tot.onTime} of ${stats.tot.timed} scheduled tasks` : "No scheduled tasks completed yet"}</div></div>

      <section class="card" aria-label="Planned and completed">
        <div class="card-head"><h2>Planned and completed</h2><div class="head-tools"><div class="legend"><span><i class="key k-plan"></i>Planned</span><span><i class="key k-done"></i>Completed</span></div><button class="btn sm ghost" onClick=${() => setTable((v) => !v)} aria-pressed=${table}>${table ? "Chart" : "Table"}</button></div></div>
        ${table ? html`<div class="tblwrap"><table class="tbl"><thead><tr><th>Day</th><th>Planned</th><th>Completed</th><th>Tasks done</th><th>Late</th><th>Free hours</th></tr></thead><tbody>${days.map((d) => html`<tr key=${d.key}><td>${T.fmtShortDate(d.key)}</td><td class="num">${T.fmtShortDur(d.planned)}</td><td class="num">${T.fmtShortDur(d.doneMin)}</td><td class="num">${d.doneCount} of ${d.count}</td><td class="num">${d.delay} min</td><td class="num">${T.fmtShortDur(d.capacity)}</td></tr>`)}</tbody></table></div>`
          : html`<${WeekChart} days=${days} sel=${selDay.key} onSel=${setSel} />`}

      </section>

      <div class="two">

          ${stats.tot.delay ? html`<${WeekChart} days=${days} sel=${selDay.key} onSel=${setSel} single=${true} />` : html`<p class="quiet">No late finishes this week. A task counts as late when it is marked done more than 5 minutes after its block ended.</p>`}
        </section>

        </section>
      </div>

      <section class="card" aria-label="Week plan">
        <div class="card-head"><h2>Week plan</h2><span class="quiet nomargin wide-only">Drag a task onto another day to move it.</span></div>
        <div class="strip" role="tablist" aria-label="Days">${days.map((d) => html`<button key=${d.key} role="tab" aria-selected=${d.key === selDay.key} class=${"sday" + (d.key === selDay.key ? " sel" : "") + (d.isToday ? " today" : "")} onClick=${() => setSel(d.key)}><span class="d">${d.label}</span><span class="n num">${d.num}</span><${Capacity} d=${d} compact=${true} /></button>`)}</div>
        <div class="lanes" ref=${lanesRef}>
          ${days.map((d) => html`<div key=${d.key} data-day=${d.key} class=${"lane" + (d.isToday ? " today" : "") + (drag && drag.over === d.key ? " over" : "") + (d.key === selDay.key ? " sel" : "")}>
            <div class="lane-h"><button class="lane-day" onClick=${() => { setViewDate(d.key); location.hash = "today"; }} title="Open this day"><b>${d.label} ${d.num}</b><span>${d.isToday ? "Today" : d.count ? d.doneCount + " of " + d.count + " done" : "Free"}</span></button><${Capacity} d=${d} /></div>
            <div class="lane-b">${chips(d).length ? chips(d).map(Chip) : html`<span class="lane-empty">Nothing planned</span>`}</div>
          </div>`)}
        </div>
        ${pickedTask ? html`<div class="movebar"><span>Move “${pickedTask.title}” to</span>${days.filter((d) => d.key !== pickedTask.date).map((d) => html`<button class="btn sm ghost" key=${d.key} onClick=${() => { h.onMoveTask(pickedTask.id, d.key); setPicked(null); }}>${d.label} ${d.num}</button>`)}<button class="btn sm soft" onClick=${() => { h.onEdit(pickedTask); setPicked(null); }}>Edit</button><button class="ibtn" aria-label="Cancel" onClick=${() => setPicked(null)}><${Icon} name="x" /></button></div>` : null}
      </section>

  }

  /* ---------- Icons studio: draw your own icons, tell Tempo when to use them ---------- */
  const r1 = (n) => Math.round(n * 10) / 10;
  const BG_SWATCHES = ["#7C3AED", "#2563EB", "#0D9488", "#16A34A", "#D97706", "#EA580C", "#DC2626", "#DB2777", "#171717", "#F4F4F5"];
  const FG_SWATCHES = ["#FFFFFF", "#171717", "#7C3AED", "#2563EB", "#16A34A", "#DC2626", "#FDE047"];
  function IconEditor({ icon, onSave, onCancel, onDelete }) {
    const [name, setName] = useState(icon.name || ""); const [hint, setHint] = useState(icon.hint || "");

<script>

        </div>

  /* ---------- assistant: one brain, two surfaces ---------- */
  const SAMPLE_ERR = {
    not_granted: "Claude is not allowed for this page. Tempo is using the built-in planner instead.",
    sampling_disabled: "Claude is not available on this account. Tempo is using the built-in planner instead.",
    not_declared: "The AI planner is not available here. Tempo is using the built-in planner instead.",
    not_configured: "The AI planner is not set up on this server yet. Tempo is using the built-in planner instead.",
    needs_code: "This Tempo needs an access code before the AI planner answers.",
    rate_limited: "Claude is busy or a usage limit was hit. Wait a moment and try again, or use the built-in planner.",
    session_expired: "Your Claude session expired. Sign in again and retry.",
    refused: "Claude declined this request. Try rephrasing it.",
    empty_completion: "Claude returned nothing. Try again with a bit more detail.",
    invalid_json: "Claude's answer was not a valid plan. Try again.",

  function CodeForm({ onSubmit, label }) {

  }
  const EngineLine = ({ a }) => html`<div class="engine"><span class=${"dot " + (a.sampleOn ? "" : "off")}></span>${a.sampleOn ? html`<span>Planner: <b>Claude</b> ${a.caps.remote ? "(server)" : "(your account)"}</span>`
    : html`<span>Planner: <b>built-in</b> (${a.caps.serverState === "unconfigured" ? "AI server has no API key yet" : a.caps.serverState === "missing" ? "no AI server found at /api/plan" : a.caps.serverState === "checking" ? "checking AI server…" : "offline rules"})</span>`}</div>`;

  function ChatLog({ state, a, compact }) {
    const bottom = useRef(null); const fmt = state.prefs.timeFormat;
    useEffect(() => { bottom.current && bottom.current.scrollIntoView({ block: "end" }); }, [state.messages.length, a.busy]);
    const msgs = compact ? state.messages.slice(-30) : state.messages;
    return html`<div class="chat" aria-live="polite">
      ${msgs.length === 0 ? html`<div class="empty"><${Icon} name="sparkles" size=${28} /><div class="big">Tell me what changed</div><p>${compact ? "Add, move, postpone or resize anything in plain words." : "Describe your day, or ask to move, postpone, resize or re-plan. I work on your existing schedule and remember what you tell me about yourself."}</p></div>` : null}
      ${msgs.map((m) => { const canUndo = m.appliedRevisionId && state.history.some((h) => h.id === m.appliedRevisionId); const p = m.proposal; return html`<div key=${m.id} class=${"msg " + (m.role === "user" ? "user" : "ai")}>
        <div class="bub">${m.text}</div>
        ${m.warnings && m.warnings.length ? m.warnings.map((w, i) => html`<div class="warn" key=${i}>${w}</div>`) : null}
        ${p ? html`<div class="proposal">
          <div class="pt">${p.status === "pending" ? "Proposed changes" : p.status === "applied" ? "Applied" : p.status === "undone" ? "Undone" : "Discarded"}</div>
          ${p.lines && p.lines.length ? html`<ul>${p.lines.map((l, i) => html`<li key=${i}>${l}</li>`)}</ul>` : html`<p style=${{ color: "var(--fg-2)", fontSize: 14 }}>The remaining blocks get new times.</p>`}
          ${p.status === "pending" ? html`<div class="pa"><button class="btn sm primary" onClick=${() => a.applyProposal(m)}><${Icon} name="check" />Apply</button><button class="btn sm ghost" onClick=${() => a.discardProposal(m)}>Discard</button></div>` : null}
        </div>` : null}
        ${m.changes && m.changes.length && !compact ? html`<div class="foot" style=${{ flexDirection: "column", alignItems: "flex-start", gap: 2 }}>${m.changes.slice(0, 4).map((l, i) => html`<span key=${i}>${l}</span>`)}</div>` : null}
        ${m.remembered && m.remembered.length ? html`<div class="foot"><${Icon} name="brain" size=${14} /><span>Remembered: ${m.remembered.join("; ")}</span><a href="#memory" onClick=${a.closePopup}>Memory</a></div>` : null}
        ${m.needsCode ? html`<${CodeForm} onSubmit=${(c) => { try { localStorage.setItem(T.CODE_KEY, c); } catch {} a.caps.setNeedsCode(false); a.send(m.retry); }} />` : null}
        ${m.error && !m.needsCode ? html`<div class="foot"><button class="btn sm ghost" onClick=${() => a.send(m.retry)}>Try again</button><button class="btn sm ghost" onClick=${() => a.send(m.retry, "local")}>Use built-in planner</button></div>` : null}
        ${m.role === "assistant" && !m.error ? html`<div class="foot">
          ${m.engine ? html`<span>${m.engine === "claude" ? "Claude" : "Built-in planner"}</span>` : null}
          ${m.nowOverride ? html`<span>· planned from ${T.fmtTime(T.parseHHMM(m.nowOverride), fmt)}</span>` : null}
          ${canUndo ? html`<span>· schedule updated</span><button class="btn sm ghost" onClick=${() => a.undo(m.appliedRevisionId)}><${Icon} name="undo" />Undo</button>` : m.undone ? html`<span>· undone</span>` : null}
          ${m.appliedRevisionId && !compact ? html`<a class="btn sm ghost" href="#today">See schedule <${Icon} name="arrow" /></a>` : null}
        </div>` : null}
      </div>`; })}
      ${a.busy ? html`<div class="msg ai"><div class="bub"><span class="thinking" aria-label="Thinking"><i></i><i></i><i></i></span> ${a.sampleOn ? "Thinking through your day…" + (a.secs > 3 ? " " + a.secs + "s" : "") : "Planning…"}</div>${a.sampleOn ? html`<div class="foot"><button class="btn sm ghost" onClick=${a.stop}><${Icon} name="stop" />Stop</button></div>` : null}</div>` : null}
      <div ref=${bottom}></div>
    </div>`;

  function Composer({ a, compact }) {
    const [text, setText] = useState(""); const [rec, setRec] = useState(false); const [recNote, setRecNote] = useState(""); const ta = useRef(null); const recRef = useRef(null);
    /* Dictation ends the moment a message is sent (or the composer goes away), and nothing it hears afterwards can land in the box. */
    const stopMic = (hard) => { const r = recRef.current; recRef.current = null; if (r) { if (hard) r.kill(); else r.stop(); } setRec(false); };
    useEffect(() => () => { if (recRef.current) recRef.current.kill(); }, []);
    const submit = () => { if (!text.trim() || a.busy) return; const v = text; stopMic(true); setRecNote(""); setText(""); a.send(v); };
    const toggleMic = () => {
      if (recRef.current) { stopMic(false); setRecNote("Review the text, then send."); return; }
      if (!T.speech.available()) { setRecNote("Voice input is not available in this browser. Type instead."); return; }
      setRecNote("Listening… tap again to stop, or just press Send."); const base = text;
      const h = T.speech.start({
        onText: (t) => setText((base ? base + " " : "") + t),
        onEnd: () => { recRef.current = null; setRec(false); setRecNote("Review the text, then send."); },
        onError: (code) => { recRef.current = null; setRec(false); setRecNote(code === "not-allowed" || code === "service-not-allowed" ? "Microphone access was refused. Type instead." : "Voice input stopped (" + code + "). You can still type."); },
      });
      if (h) { recRef.current = h; setRec(true); }
    };
    const onKey = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); } };
    const examples = compact
      ? ["Move my client call to tomorrow at 10 AM", "Add 45 minutes for the quarterly report before 4 PM", "I want to be completely done by 6 PM", "I'm running 20 minutes behind", "Reorganize the rest of my day"]
      : ["Move my client call to tomorrow at 10 AM.", "Schedule a gym session for Friday at 7 AM.", "Add 45 minutes for the quarterly report before 4 PM.", "I want to be completely done by 6 PM.", "Remember that I pick up the kids at 3:30 PM on weekdays.", "Move the groceries to after my team meeting.", "I'm running 20 minutes behind.", "Give me a 15-minute break.", "Reorganize the rest of my day."];
    const codeBox = a.caps.needsCode ? html`<div class="note warn"><div style=${{ marginBottom: 8 }}>Claude is ready on this server. Enter the access code to use it.</div><${CodeForm} label="Unlock" onSubmit=${(c) => { try { localStorage.setItem(T.CODE_KEY, c); } catch {} a.caps.setNeedsCode(false); }} /></div>` : null;
    if (compact) return html`<div class="pop-foot">
      ${codeBox}
      <div class="chips scroll">${examples.map((ex, i) => html`<button key=${i} class="chip" onClick=${() => { setText(ex); ta.current && ta.current.focus(); }}>${ex}</button>`)}</div>
      ${recNote ? html`<div class="engine">${recNote}</div>` : null}
      <div class="composer-row with-mic">
        <button class=${"mic sm " + (rec ? "rec" : "")} aria-label=${rec ? "Stop recording" : "Start voice input"} aria-pressed=${rec} onClick=${toggleMic} disabled=${a.busy}><${Icon} name=${rec ? "stop" : "mic"} /></button>
        <textarea id="pop-composer" ref=${ta} class="in" rows="1" style=${{ minHeight: 42, resize: "none" }} value=${text} onInput=${(e) => setText(e.target.value)} onKeyDown=${onKey} placeholder="Move the dentist to Thursday, add a gym hour…" aria-label="Message to the planning assistant" autoFocus></textarea>
        <button class="btn primary" onClick=${submit} disabled=${a.busy || !text.trim()} aria-label="Send"><${Icon} name="send" /></button>
      </div>
    </div>`;
    return html`<section class="card composer" aria-label="Compose">
      ${codeBox}
      <div class="mic-wrap">
        <button class=${"mic " + (rec ? "rec" : "")} aria-label=${rec ? "Stop recording" : "Start voice input"} aria-pressed=${rec} onClick=${toggleMic} disabled=${a.busy}><${Icon} name=${rec ? "stop" : "mic"} /></button>
        <span>${recNote || (T.speech.available() ? "Tap to dictate, or type below. Dictation stops when you send." : "Voice input is not available in this browser. Type below.")}</span>
      </div>
      <div class="composer-row">
        <textarea id="composer" ref=${ta} class="in" rows="3" value=${text} onInput=${(e) => setText(e.target.value)} onKeyDown=${onKey} placeholder="Tomorrow I have a client call at 10, need two hours for the budget report, and want to be at the gym by 6…" aria-label="Message to the planning assistant"></textarea>
        <button class="btn primary" onClick=${submit} disabled=${a.busy || !text.trim()} aria-label="Send"><${Icon} name="send" />Send</button>
      </div>
      <div class="chips">${examples.map((ex, i) => html`<button key=${i} class="chip" onClick=${() => { setText(ex); ta.current && ta.current.focus(); }}>${ex}</button>`)}</div>
    </section>`;
  }

  /* ---------- views ---------- */

      <${IntelCard} an=${sg.an} intel=${state.intel} prefs=${state.prefs} memoryCount=${state.prefs.memoryEnabled === false ? 0 : state.memory.length} />
      <${ProgressCard} tasks=${tasks} prefs=${state.prefs} nowMin=${nowMin} isToday=${isToday} onStatus=${actions.onStatus} onLate=${h.onLate} onFocus=${actions.onFocus} />
      <${ScheduleCard} title=${day.title && day.title !== T.DAY_TITLE ? day.title : isToday ? "Today's schedule" : "Schedule"} tasks=${tasks} day=${day} prefs=${state.prefs} nowMin=${nowMin} isToday=${isToday} actions=${actions}
        onAdd=${(preset) => h.onAdd(viewDate, preset)} onReorder=${(ids) => h.onReorder(viewDate, ids)} onDayAction=${(kind) => h.onDayAction(viewDate, kind)} canUndo=${!!last} undoLabel=${last ? last.note : ""} view=${state.prefs.scheduleView} onView=${h.onView}
        emptyHint=${isToday ? null : "Nothing is planned for this day. Add a task, or ask the assistant to schedule something here."} />

  function CalendarView({ state, nowMin, today, actions, h, setViewDate }) {

    const tasks = tasksFor(state.tasks, sel); const day = state.days[sel] || {};
    const upcoming = Object.values(state.tasks).filter((t) => t.date > today && t.status !== "completed" && isWork(t)).sort((a, b) => a.date.localeCompare(b.date) || (a.start ?? 1e9) - (b.start ?? 1e9)).slice(0, 8);

      ${upcoming.length && sel === today ? html`<section class="card"><div class="card-head"><h2>Coming up</h2></div><ul class="rows">${upcoming.map((t) => { const look = iconLook(t); return html`<li class="row" key=${t.id}><div class="row-inner plain"><div class="tile" style=${look.style}><${Glyph} markup=${look.markup} /></div><div class="body"><div class="title">${t.title}</div><div class="dur">${T.relDay(t.date, today)}${t.start != null ? " at " + T.fmtTime(t.start, state.prefs.timeFormat) : ""} · ${T.fmtDur(t.estimatedMinutes)}</div></div><div class="acts"><button class="btn sm ghost" onClick=${() => { setSel(t.date); setAnchor(t.date); }}>Open</button></div></div></li>`; })}</ul></section>` : null}

  function TasksView({ state, nowMin, today, actions, h }) {

          if (st.prefs.autoStartNext && !allDone) { const next = dayWork.filter((x) => x.id !== id && isActive(x) && x.start != null && x.status !== "in_progress").sort((x, y) => x.start - y.start)[0]; if (next) dispatch({ type: "setStatus", id: next.id, status: "in_progress" }); }
        } else if (status === "in_progress") toast("Focus timer started");
      },
      onEdit: (task) => setEditing(task),
      onPostpone: (id) => { const t = stateRef.current.tasks[id]; if (!t) return; dispatch({ type: "postpone", id, toDate: T.addDays(t.date < T.dayKey() ? T.dayKey() : t.date, 1) }); toast("Moved to tomorrow", () => dispatch({ type: "undo" })); },
      onPark: (id) => { dispatch({ type: "postpone", id }); toast("Postponed, no time set", () => dispatch({ type: "undo" })); },
      onDelete: (id) => { if (!stateRef.current.tasks[id]) return; dispatch({ type: "deleteTask", id }); setEditing(null); toast("Task deleted", () => dispatch({ type: "undo" })); },
      onMove: (task) => setEditing(task),
      onFocus: (id) => { const t = stateRef.current.tasks[id]; if (!t) return; if (t.status !== "completed" && t.status !== "in_progress") dispatch({ type: "setStatus", id, status: "in_progress" }); setFocusId(id); },
      onDuplicate: (id) => { const t = stateRef.current.tasks[id]; if (!t) return; const copy = { ...t, id: T.uid(), title: t.title + " (copy)", status: "upcoming", start: undefined, end: undefined, doneBullets: [], spentMs: 0, startedAt: undefined, completedAt: undefined, actualMinutes: undefined, createdAt: Date.now(), updatedAt: Date.now() }; dispatch({ type: "addTask", task: copy }); toast("Duplicated, without a time yet", () => dispatch({ type: "undo" })); },
      onToggleBullet: (id, text) => {
        const t = stateRef.current.tasks[id]; dispatch({ type: "toggleBullet", id, text, silent: true }); if (!t || t.status === "completed") return;
        const after = (t.doneBullets || []).includes(text) ? (t.doneBullets || []).filter((x) => x !== text) : [...(t.doneBullets || []), text];
        if ((t.bullets || []).length && (t.bullets || []).every((b) => after.includes(b))) toast("All steps ticked. Mark the task complete?", () => actions.onStatus(id, "completed"), "Complete");
      },
    }), [toast]);

    const h = {
      undoLast,
      onEdit: (task) => setEditing(task),
      onAdd: (date, preset) => setEditing({ date: typeof date === "string" ? date : T.dayKey(), ...(preset && typeof preset === "object" && !preset.nativeEvent ? preset : {}) }),
      onView: (v) => dispatch({ type: "setPrefs", patch: { scheduleView: v } }),
      openAssistant: () => setPop(true),
      onAsk: (date) => { setPop(true); const d0 = T.dayKey(); send(date === d0 ? "Review my day and propose the best order and timing for what is left." : `Review my plan for ${T.dayPhrase(date, d0)} and propose the best order and timing.`); },
      onDismissSuggestion: (s, date) => { if (s.action.type === "carry") dispatch({ type: "setDayMeta", date, patch: { carryDismissed: true } }); dispatch({ type: "dismissSuggestion", date, id: s.id }); },
      onCarry: (ids) => { const st = stateRef.current; const set = new Set(ids); const day0 = T.dayKey(); const rev = commit(Object.values(st.tasks).map((t) => (set.has(t.id) ? { ...t, date: day0, start: undefined, end: undefined, status: "upcoming", postponedFrom: t.date, updatedAt: Date.now() } : t)), "bringing tasks into today", "manual"); track("carry"); toast(`${ids.length} task${ids.length > 1 ? "s" : ""} moved to today`, () => undo(rev)); },
      onDeletePriority: (id) => { const st = stateRef.current; if (Object.values(st.tasks).some((t) => t.priority === id)) commit(Object.values(st.tasks).map((t) => (t.priority === id ? { ...t, priority: "medium" } : t)), "removing a priority", "manual"); dispatch({ type: "setPrefs", patch: { priorities: (st.prefs.priorities || []).filter((x) => x.id !== id) } }); toast("Priority deleted. Its tasks are now Medium."); },
      onQuick: (text, date0) => {
        const st = stateRef.current; const q = T.parseQuick(text, T.dayKey(), st.prefs.learnFromHistory === false ? null : st.intel); if (!q) return; const date = q.date || date0; const day0 = T.dayKey(); const isT = date === day0;
        const dayT = Object.values(st.tasks).filter((t) => t.date === date); let start = q.start; let noteT = "";
        if (start == null) { const from = isT ? T.minutesNow() : st.prefs.workdayStart; const limit = T.dayLimit(dayT, st.days[date], st.prefs, from); const slot = T.findSlot(dayT, q.estimatedMinutes, from, limit); if (slot != null) { start = slot; track("autoslot"); } else noteT = `, no free slot before ${T.fmtTime(limit, st.prefs.timeFormat)} so it has no time yet`; }
        const task = T.makeTask({ date, title: q.title, category: q.category, priority: q.priority, estimatedMinutes: q.estimatedMinutes, start: start ?? undefined });
        dispatch({ type: "addTask", task });
        toast(`Added “${task.title}” · ${T.fmtShortDur(task.estimatedMinutes)}${start != null ? " at " + T.fmtTime(start, st.prefs.timeFormat) : ""}${date !== date0 ? " " + T.onDay(date, day0) : ""}${noteT}`, () => dispatch({ type: "undo" }));
      },
      onMoveTask: (id, date) => {
        const st = stateRef.current; const t = st.tasks[id]; if (!t || t.date === date) return; const day0 = T.dayKey(); const dayT = Object.values(st.tasks).filter((x) => x.date === date);
        const from = date === day0 ? T.minutesNow() : st.prefs.workdayStart; const slot = t.status === "completed" ? null : T.findSlot(dayT, t.estimatedMinutes, from, T.dayLimit(dayT, st.days[date], st.prefs, from));
        dispatch({ type: "postpone", id, toDate: date, start: slot ?? undefined, note: "moving a task" }); track("move");
        toast(`“${t.title}” moved to ${T.dayPhrase(date, day0)}${slot != null ? " at " + T.fmtTime(slot, st.prefs.timeFormat) : ", no time yet"}`, () => dispatch({ type: "undo" }));
      },
      onReorder: (date, ids) => {
        const st = stateRef.current; const all = Object.values(st.tasks); const dayT = all.filter((t) => t.date === date); const isT = date === T.dayKey();
        const movable = ids.filter((id) => { const t = st.tasks[id]; return t && t.status !== "completed" && !isPinned(t); });
        const starts = dayT.filter((t) => movable.includes(t.id) && t.start != null).map((t) => t.start); const first = starts.length ? Math.min(...starts) : st.prefs.workdayStart; const base = isT ? Math.max(T.minutesNow(), first) : first;
        const prot = dayT.filter((t) => t.status === "protected" && t.start != null && t.start >= base).sort((x, y) => x.start - y.start)[0];
        const laid = T.layoutDay(dayT.map((t) => (movable.includes(t.id) && t.status === "postponed" ? { ...t, status: "upcoming" } : t)), { now: base, limit: prot ? prot.start : st.prefs.bedTime, prefs: { ...st.prefs, bufferMinutes: 0 }, intel: st.intel, date, order: movable, keepBreaks: true });
        const result = laid.tasks.map((t) => { const o = st.tasks[t.id]; return o && o.start == null && t.start == null ? o : t; });
        const lost = laid.unscheduled.filter((u) => st.tasks[u.task.id] && st.tasks[u.task.id].start != null).length;
        const rev = commit([...all.filter((t) => t.date !== date), ...result], "the reorder", "manual"); track("reorder");
        toast(lost ? `Reordered. ${lost} did not fit and ${lost > 1 ? "are" : "is"} parked.` : "Order updated, times recalculated", () => undo(rev));
      },
      /* run a suggestion the moment the user presses OK */
      onSuggestion: (s, date) => {
        const st = stateRef.current; const act = s.action; const ts = Date.now(); let msg = "Done"; let rev = null;
        if (act.type === "carry") { h.onCarry(act.ids); dispatch({ type: "dismissSuggestion", date, id: s.id }); return; }
        if (act.type === "protect") { dispatch({ type: "addTask", task: T.makeTask({ date, title: "Free evening", category: "free", priority: "low", estimatedMinutes: act.minutes, start: act.start, status: "protected", fixed: true }), note: "protecting your evening" }); msg = `Evening protected from ${T.fmtTime(act.start, st.prefs.timeFormat)}`; }
        else if (act.type === "replan") { const r = relay(date, null, { keepOrder: true, fillGaps: true }, "the re-plan"); rev = r.rev; msg = "Re-planned." + parkedNote(r.laid); track("replan"); }
        else if (act.type === "prioritize") { const r = relay(date, null, {}, "the reorder by priority"); rev = r.rev; msg = "Most important work now comes first." + parkedNote(r.laid); }
        else if (act.type === "move") { const r = relay(date, (d, extra) => { const an = T.analyzeDay(d, { now: T.minutesNow(), day: st.days[date] || {}, prefs: st.prefs, intel: st.intel, isToday: date === T.dayKey() }); const ids = new Set(an.toMove.map((t) => t.id)); const next = T.addDays(date, 1); for (const t of d) if (ids.has(t.id)) extra.push({ ...t, date: next, start: undefined, end: undefined, status: "upcoming", postponedFrom: date, updatedAt: ts }); return d.filter((t) => !ids.has(t.id)); }, { keepOrder: true, fillGaps: true }, "moving the overflow"); rev = r.rev; msg = `${r.extra.length} task${r.extra.length > 1 ? "s" : ""} moved to ${T.dayPhrase(T.addDays(date, 1), T.dayKey())}`; }
        else if (act.type === "resize") { const t0 = st.tasks[act.taskId]; if (!t0) return; const r = relay(date, (d) => d.map((t) => { if (t.id !== act.taskId) return t; const est = Math.max(5, t.estimatedMinutes + act.minutes); return { ...t, estimatedMinutes: est, end: t.start != null ? t.start + est : t.end, tuned: true, updatedAt: ts }; }), { keepOrder: true, keepBreaks: true }, "the duration change"); rev = r.rev; msg = `“${t0.title}” is now ${T.fmtDur(Math.max(5, t0.estimatedMinutes + act.minutes))}.` + parkedNote(r.laid); }
        else if (act.type === "break") { let order = null; const r = relay(date, (d) => { const br = T.makeTask({ date, title: "Break", category: "break", priority: "low", estimatedMinutes: act.minutes }); const seq = d.filter((t) => isActive(t) && !isPinned(t)).sort((x, y) => (x.start ?? 1e9) - (y.start ?? 1e9)).map((t) => t.id); const at = seq.indexOf(act.afterId); seq.splice(at + 1, 0, br.id); order = seq; return [...d, br]; }, () => ({ order, keepBreaks: true }), "adding a break"); rev = r.rev; msg = `Added a ${act.minutes}-minute break.` + parkedNote(r.laid); }
        else if (act.type === "addFixed") { const r = relay(date, (d) => [...d, T.makeTask({ date, title: act.title, category: T.guessCategory(act.title), estimatedMinutes: act.minutes, start: act.start, fixed: true })], { keepOrder: true, keepBreaks: true }, "adding a commitment"); rev = r.rev; msg = `Added “${act.title}” at ${T.fmtTime(act.start, st.prefs.timeFormat)}.` + parkedNote(r.laid); }
        track("suggestion"); dispatch({ type: "dismissSuggestion", date, id: s.id });
        toast(msg, () => (rev ? undo(rev) : dispatch({ type: "undo" })));
      },
      /* the schedule's three-dot menu */
      onDayAction: (date, kind) => {
        const st = stateRef.current; const all = Object.values(st.tasks); const dayT = all.filter((t) => t.date === date); const ts = Date.now(); const fmt = st.prefs.timeFormat;
        if (kind === "undo") return undoLast();
        if (kind === "protect") return h.onAdd(date, { status: "protected", category: "free", title: "Free time", fixed: true, estimatedMinutes: 60 });
        if (kind === "copy") { const text = T.planText(dayT, date, st.prefs); const fail = () => toast("Copying is not available in this browser"); try { navigator.clipboard.writeText(text).then(() => toast("Plan copied as text"), fail); } catch { fail(); } return; }
        if (kind === "deleteAll") { const rev = commit(all.filter((t) => t.date !== date), "deleting the whole day", "manual"); return toast(`Deleted ${dayT.length} item${dayT.length === 1 ? "" : "s"}`, () => undo(rev)); }
        if (kind === "clearDone") { const n = dayT.filter((t) => t.status === "completed").length; const rev = commit(all.filter((t) => !(t.date === date && t.status === "completed")), "clearing completed tasks", "manual"); return toast(`Cleared ${n} completed task${n === 1 ? "" : "s"}`, () => undo(rev)); }
        let r, msg;
        if (kind === "replan") { r = relay(date, null, { keepOrder: true, fillGaps: true }, "the re-plan"); msg = "Re-planned from " + T.fmtTime(r.an.base, fmt) + "." + parkedNote(r.laid); track("replan"); }
        else if (kind === "prioritize") { r = relay(date, null, {}, "sorting by priority"); msg = "Sorted by priority." + parkedNote(r.laid); track("replan"); }
        else if (kind === "breakNow") { const len = T.preferredBreak(st.intel, st.prefs.defaultBreakMinutes) || 10; r = relay(date, null, { keepOrder: true, keepBreaks: true, leadingBreak: len }, "adding a break"); msg = `Added a ${len}-minute break now.` + parkedNote(r.laid); }
        else if (kind === "noBreaks") { r = relay(date, (d) => d.filter((t) => !(t.category === "break" && !t.fixed && isActive(t))), { keepOrder: true, keepBreaks: true }, "removing the breaks"); msg = "Breaks removed."; }
        else if (kind === "moveRest") { const next = T.addDays(date, 1); r = relay(date, (d, extra) => { for (const t of d) if (isActive(t) && isWork(t) && !t.fixed) extra.push({ ...t, date: next, start: undefined, end: undefined, status: "upcoming", postponedFrom: date, updatedAt: ts }); return d.filter((t) => !(isActive(t) && !t.fixed && t.status !== "protected")); }, { keepOrder: true, keepBreaks: true }, "moving the rest of the day"); msg = `${r.extra.length} task${r.extra.length === 1 ? "" : "s"} moved to ${T.dayPhrase(next, T.dayKey())}`; track("move"); }
        if (r) toast(msg, () => undo(r.rev));
      },
      onLate: (mins) => {
        const st = stateRef.current; const day0 = T.dayKey(); const nm = T.minutesNow();
        const plan = T.localPlan({ message: `I'm running ${mins} minutes behind.`, allTasks: Object.values(st.tasks), prefs: { ...st.prefs, memoryEnabled: false }, intel: st.intel, date: day0, nowMinutes: nm, days: st.days });
        const res = T.applyPlan(Object.values(st.tasks), plan, { today: day0, now: nm, prefs: st.prefs });
        const ends = (list) => Math.max(0, ...list.filter((t) => t.date === day0 && isActive(t) && isWork(t) && !t.fixed && t.end != null).map((t) => t.end));
        const before = ends(Object.values(st.tasks)), after = ends(res.tasks);
        const lines = T.describeSummary(res.summary, day0, st.prefs.timeFormat).filter((l) => !/new time/.test(l));
        if (after && before) lines.unshift(after === before ? `Your last block still ends at ${T.fmtTime(after, st.prefs.timeFormat)}.` : `Your last block ends at ${T.fmtTime(after, st.prefs.timeFormat)} instead of ${T.fmtTime(before, st.prefs.timeFormat)}.`);
        setSheet({ title: `Running ${mins} minutes late`, intro: "Here is what shifting the rest of today does. Fixed commitments and protected time stay where they are.", lines, warnings: res.warnings.filter((w) => /fit|available|parked|protected|bedtime/.test(w)), applyLabel: "Shift my day", onApply: () => { track("late"); const rev = commit(res.tasks, "the shift for running late", "manual"); setSheet(null); toast("Schedule shifted", () => undo(rev)); } });
      },
    };
    const onSave = (t) => { if (t.id) dispatch({ type: "updateTask", id: t.id, patch: t }); else dispatch({ type: "addTask", task: T.makeTask(t) }); setEditing(null); toast(t.id ? "Saved" : t.status === "protected" ? "Time protected" : "Task added", () => dispatch({ type: "undo" })); };

    const focusTask = focusId ? state.tasks[focusId] : null;
    const focusNext = focusTask ? tasksFor(state.tasks, focusTask.date).find((t) => t.id !== focusTask.id && isActive(t) && isWork(t) && t.start != null && (focusTask.start == null || t.start >= focusTask.start)) : null;
    const view = route === "assistant" ? html`<${AssistantView} state=${state} a=${a} dispatch=${dispatch} />`
      : route === "calendar" ? html`<${CalendarView} state=${state} nowMin=${nowMin} today=${today} actions=${actions} h=${h} setViewDate=${setViewDate} />`
      : route === "tasks" ? html`<${TasksView} state=${state} nowMin=${nowMin} today=${today} actions=${actions} h=${h} />`
      : route === "week" ? html`<${UI.WeeklyView} state=${state} today=${today} h=${h} setViewDate=${setViewDate} />`
      : route === "memory" ? html`<${UI.MemoryView} state=${state} dispatch=${dispatch} toast=${toast} />`
      : route === "icons" ? html`<${UI.IconsView} state=${state} dispatch=${dispatch} toast=${toast} />`
      : route === "more" ? html`<${UI.MoreView} />`
      : route === "preferences" ? html`<${PrefsView} state=${state} dispatch=${dispatch} caps=${caps} toast=${toast} h=${h} />`
      : html`<${TodayView} state=${state} nowMin=${nowMin} today=${today} viewDate=${viewDate} setViewDate=${(d) => setViewDate(d === today ? null : d)} actions=${actions} h=${h} />`;
    const known = NAV.some(([x]) => x === route); const onToday = !known || route === "today";
    const active = (r) => route === r || (r === "today" && onToday) || (r === "more" && MORE.has(route));

    return html`<div class=${"shell" + (state.prefs.compact ? " compact" : "")}>
      <nav class="nav" aria-label="Main">
        <div class="nav-inner">
          <div class="brand"><div class="b1"><i></i>Tempo</div></div>
          ${NAV.map(([r, label, short, icon, only]) => html`<a key=${r} href=${"#" + r} class=${(active(r) ? "on " : "") + (only === "d" ? "d-only" : only === "m" ? "m-only" : "")} aria-current=${route === r ? "page" : undefined}><${Icon} name=${icon} /><span class="lg">${label}</span><span class="sm">${short}</span></a>`)}
        </div>
      </nav>
      <main class="main view" key=${route}>${view}</main>
      ${pop && onToday ? html`<${AssistantPopup} state=${state} a=${a} onClose=${() => setPop(false)} />` : null}
      ${focusTask ? html`<${UI.FocusMode} task=${focusTask} next=${focusNext} prefs=${state.prefs} onStatus=${actions.onStatus} onToggleBullet=${actions.onToggleBullet} onNotes=${(id, notes) => dispatch({ type: "setNotes", id, notes })} onExtend=${(id, m) => dispatch({ type: "updateTask", id, patch: { estimatedMinutes: state.tasks[id].estimatedMinutes + m }, note: "adding focus time" })} onClose=${() => setFocusId(null)} />` : null}
      ${editing ? html`<${TaskEditor} task=${editing} date=${viewDate} prefs=${state.prefs} icons=${state.icons} onSave=${onSave} onClose=${() => setEditing(null)} onDelete=${actions.onDelete} />` : null}
      ${sheet ? html`<${ImpactSheet} ...${sheet} onClose=${() => setSheet(null)} />` : null}
      ${fx ? html`<${UI.Celebration} key=${fx.key} kind=${fx.kind} title=${fx.title} rect=${fx.rect} onDone=${() => setFx(null)} />` : null}
      ${toastMsg ? html`<div class="toast" role="status"><span>${toastMsg.text}</span>${toastMsg.undo ? html`<button onClick=${() => { toastMsg.undo(); setToastMsg(null); }}>${toastMsg.label || "Undo"}</button>` : null}</div>` : null}
    </div>`;
  }

  const start = () => { const root = ReactDOM.createRoot(document.getElementById("app")); root.render(html`<${App} />`); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
</body>
